<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLIP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-shell">

    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="3"></circle>
            <circle cx="6" cy="18" r="3"></circle>
            <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
            <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
            <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
          </svg>
        </div>
        <span class="brand-name">CLIP</span>
        <span class="brand-tag">v2.1.1</span>
      </div>

      <div class="status-pill" id="service-status-pill" title="Masaüstü Servis Durumu">
        <span class="status-pulse" id="status-dot"></span>
        <span class="status-label" id="status-text">Hazır</span>
      </div>
    </header>

    <!-- Main -->
    <main class="app-main">

      <!-- URL Input Card -->
      <div class="cmd-bar" id="input-section">
        <div class="input-field-wrap">
          <span class="input-icon" id="cmd-platform-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
          </span>
          <input
            type="url"
            id="video-url-input"
            class="input-elem"
            placeholder="Video bağlantısı yapıştırın..."
            autocomplete="off"
            spellcheck="false"
          >
          <button type="button" id="paste-btn" class="paste-badge" title="Panodan Yapıştır">
            <kbd id="paste-kbd">Ctrl+V</kbd>
          </button>
          <button type="button" id="clear-input-btn" class="clear-icon" style="display:none;" title="Temizle">✕</button>
        </div>

        <button type="button" id="process-btn" class="primary-action-btn">
          <span class="btn-inner">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="6" cy="6" r="3"></circle>
              <circle cx="6" cy="18" r="3"></circle>
              <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
              <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
              <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
            </svg>
            <span>Panoya Kopyala</span>
          </span>
        </button>
      </div>

      <!-- Processing State -->
      <div class="state-view processing" id="processing-section" style="display: none;">
        <div class="ring-spinner"></div>
        <div class="state-title">Video Hazırlanıyor...</div>
        <div class="state-sub">H.264 formatına dönüştürülüp panoya kopyalanıyor</div>
      </div>

      <!-- Ready State -->
      <div class="state-view ready" id="ready-section" style="display: none;">
        <div class="success-callout">
          <span class="success-icon">✓</span>
          <div class="success-msg">
            <strong>Panoya Kopyalandı!</strong>
            <span>Discord veya WhatsApp'a <span class="paste-target-key">Ctrl+V</span> yapın</span>
          </div>
        </div>

        <div class="media-frame">
          <video id="preview-video" class="media-player" controls loop muted playsinline></video>
        </div>

        <div class="drag-surface" id="popup-drag-zone" draggable="true" title="Sürükle & Bırak">
          <span>↗ Sürükle & Bırak veya <span class="paste-target-key">Ctrl+V</span> yap</span>
        </div>

        <div class="tool-actions">
          <button type="button" id="action-recopy-btn" class="tool-btn">Tekrar Kopyala</button>
          <button type="button" id="action-folder-btn" class="tool-btn">Klasör</button>
          <button type="button" id="action-download-btn" class="tool-btn">İndir</button>
          <button type="button" id="action-new-btn" class="tool-btn ghost">+ Yeni</button>
        </div>
      </div>

      <!-- Recent History -->
      <section class="history-block">
        <div class="history-top">
          <span class="history-label">Son Klipler</span>
          <button type="button" id="clear-history-btn" class="history-clear">Temizle</button>
        </div>

        <div class="history-scroll" id="history-list">
          <div class="empty-hint" id="history-empty">
            Henüz klip yok. Videodaki klip butonuna basarak anında panoya alabilirsiniz.
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <span class="footer-left">Açık Kaynak &amp; Limitsiz</span>
      <div class="footer-right">
        <button type="button" id="open-folder-btn" class="footer-link">Klasör</button>
        <button type="button" id="open-wizard-btn" class="footer-link">Ayarlar</button>
      </div>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
